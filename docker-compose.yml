services:
  web:
    build: .
    container_name: endri-profile
    ports:
      - "8767:80"
    restart: always
    environment:
      - PORT=80
    volumes:
      - uploads_data:/app/uploads
    networks:
      - custom_network

volumes:
  uploads_data:

networks:
  custom_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
